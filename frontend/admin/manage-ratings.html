<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Ratings - Admin Panel</title>
    <link rel="stylesheet" href="../css/rating.css">
    <style>
        body {
            background: #0b0b0b;
            color: #fff;
            font-family: 'Poppins', sans-serif;
            padding: 40px 20px;
        }

        .admin-panel {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: #d4af37;
            text-align: center;
            margin-bottom: 40px;
            font-family: 'Cinzel', serif;
        }

        .rating-card {
            background: #111;
            padding: 25px;
            border-radius: 18px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            margin-bottom: 25px;
            transition: 0.3s;
        }

        .rating-card:hover {
            border-color: #d4af37;
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.1);
        }

        .rating-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .rating-stars {
            color: #d4af37;
            font-size: 24px;
        }

        .rating-message {
            margin: 15px 0;
            color: #eee;
            font-size: 16px;
            font-style: italic;
            line-height: 1.6;
        }

        .rating-meta {
            display: flex;
            gap: 20px;
            font-size: 13px;
            color: #666;
            margin-bottom: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 15px;
        }

        .btn-group {
            display: flex;
            gap: 12px;
        }

        .btn {
            padding: 10px 24px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            font-size: 14px;
        }

        .btn-approve {
            background: linear-gradient(135deg, #d4af37, #b8962e);
            color: #000;
        }

        .btn-delete {
            background: #222;
            color: #ff4d4d;
            border: 1px solid rgba(255, 77, 77, 0.3);
        }

        .btn-delete:hover {
            background: #ff4d4d;
            color: #fff;
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .status-pending {
            background: rgba(212, 175, 55, 0.1);
            color: #d4af37;
            border: 1px solid #d4af37;
        }

        .status-approved {
            background: rgba(46, 204, 113, 0.1);
            color: #2ecc71;
            border: 1px solid #2ecc71;
        }

        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: #555;
            background: #111;
            border-radius: 18px;
            border: 1px dashed rgba(212, 175, 55, 0.2);
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #d4af37;
            text-decoration: none;
            font-weight: 500;
        }
    </style>
</head>

<body>
    <div class="admin-panel">
        <a href="/admin/dashboard.html" class="back-link">← Back to Dashboard</a>
        <h1>📋 Manage Ratings</h1>

        <div id="ratings-list"></div>
    </div>

    <script src="../js/rating-api.js"></script>
    <script>
        const ratingsList = document.getElementById('ratings-list');

        async function loadAllRatings() {
            // Get all ratings (we'll fetch pending and approved to manage them)
            const result = await RatingAPI.getPendingRatings();
            const approvedResult = await RatingAPI.getApprovedRatings();

            let allRatings = [];
            if (result.success && result.data.ratings) {
                allRatings = [...result.data.ratings];
            }
            if (approvedResult.success && approvedResult.data.ratings) {
                // Add approved flag if not present
                const approved = approvedResult.data.ratings.map(r => ({ ...r, approved: true }));
                allRatings = [...allRatings, ...approved];
            }

            if (allRatings.length === 0) {
                ratingsList.innerHTML = `
                    <div class="empty-state">
                        <p>No ratings found in the system.</p>
                    </div>
                `;
                return;
            }

            // Sort by date newest first
            allRatings.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

            ratingsList.innerHTML = allRatings.map(rating => `
                <div class="rating-card" data-id="${rating._id}">
                    <div class="rating-header">
                        <span class="rating-stars">${'★'.repeat(rating.rating)}${'☆'.repeat(5 - rating.rating)}</span>
                        <span class="status-badge ${rating.approved ? 'status-approved' : 'status-pending'}">
                            ${rating.approved ? 'Approved' : 'Pending'}
                        </span>
                    </div>
                    ${rating.message ? `<div class="rating-message">"${rating.message}"</div>` : ''}
                    <div class="rating-meta">
                        <span>Service: ${rating.service}</span>
                        <span>Date: ${new Date(rating.createdAt).toLocaleDateString()}</span>
                    </div>
                    <div class="btn-group">
                        ${!rating.approved ? `
                            <button class="btn btn-approve" onclick="approve('${rating._id}')">Approve</button>
                        ` : ''}
                        <button class="btn btn-delete" onclick="remove('${rating._id}')">Delete</button>
                    </div>
                </div>
            `).join('');
        }

        async function approve(id) {
            if (!confirm('Approve this rating?')) return;
            const res = await RatingAPI.approveRating(id);
            if (res.success) {
                alert('Approved!');
                loadAllRatings();
            } else {
                alert('Error: ' + res.message);
            }
        }

        async function remove(id) {
            if (!confirm('Delete this rating forever?')) return;
            const res = await RatingAPI.deleteRating(id);
            if (res.success) {
                alert('Deleted!');
                loadAllRatings();
            } else {
                alert('Error: ' + res.message);
            }
        }

        loadAllRatings();
    </script>
</body>

</html>
